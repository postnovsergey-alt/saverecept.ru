<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIN — Самобранка</title>
<link rel="stylesheet" href="/static/style.css?v={{ asset_ver }}">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body class="centered">
<div class="login-card">
  <svg class="brand-mark big" viewBox="0 0 32 32" aria-hidden="true">
    <path d="M4 18c0-6.6 5.4-12 12-12s12 5.4 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="2" y="18" width="28" height="3.4" rx="1.7" fill="currentColor"/>
    <circle cx="16" cy="4" r="1.7" fill="currentColor"/>
  </svg>
  <h1>Введите PIN</h1>
  <p class="muted">{{ current_user.display_name or current_user.email }}</p>
  <form method="post" action="/unlock" id="pin-form">
    <input type="hidden" name="next" value="{{ next }}">
    <input type="tel" inputmode="numeric" pattern="\d{4}" maxlength="4" minlength="4"
           name="pin" id="pin-input" placeholder="••••" required autofocus autocomplete="off">
    <button class="btn btn-primary btn-lg" type="submit">Войти</button>
  </form>
  {% if error %}<p class="error-text">{{ error }}</p>{% endif %}
  <p class="muted small">Забыли PIN? <a href="/logout">Выйти и войти по паролю</a></p>
</div>
<script>
  const input = document.getElementById('pin-input');
  const form = document.getElementById('pin-form');
  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '').slice(0, 4);
    if (input.value.length === 4) form.requestSubmit();
  });
</script>
</body>
</html>
